services:
  app:
    build: .
    container_name: medical-diary-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${HTTP_PORT:-8000}:8000"
    volumes:
      - ./data:/data
      - ./backups:/backups
      - ./static:/app/static:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\""
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
